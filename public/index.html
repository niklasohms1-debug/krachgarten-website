<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Radio Dashboard</title>
    <style>
        /* FIXIERTER HEADER OBEN (STAY-ON-TOP) */
        .sticky-header-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #121214;
            padding-top: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #29292e;
        }

        body { font-family: 'Segoe UI', sans-serif; background: #121214; color: #e1e1e6; padding: 0 20px 20px 20px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: auto; padding-bottom: 10px; }
        .main { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; max-width: 1000px; margin: 20px auto; }
        .card { background: #202024; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #29292e; }

        /* CONTAINER FÜR DEN ORIGINAL RADIO.CO PLAYER */
        .radio-co-player-wrapper {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
        }

        /* NAVIGATIONSTASTEN OHNE SEITENNEULADEN */
        .nav-btn {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .nav-btn.active {
            color: #ff4757;
            background: #29292e;
        }
        .nav-btn.inactive {
            color: #a8a8b3;
        }

        .page-section {
            display: none;
        }
        .page-section.active {
            display: grid;
        }

        /* TEAM KATEGORIEN & CARDS */
        .team-category {
            margin-bottom: 25px;
        }
        .team-category-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #ff4757;
            padding-bottom: 6px;
        }
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .team-card {
            background: #2a2a30;
            padding: 20px 15px;
            border-radius: 10px;
            border: 1px solid #323238;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .team-card-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .team-card-role {
            background: #ff4757;
            color: #ffffff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
        }

        /* MODAL POPUP FÜR TRACKLIST */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-card {
            background: #202024;
            border: 1px solid #29292e;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #29292e;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .modal-close {
            background: none;
            border: none;
            color: #ff4757;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
        }
        .track-item {
            background: #121214;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #29292e;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- FIXIERTER HEADER-CONTAINER -->
    <div class="sticky-header-wrapper">
        <!-- MENÜLEISTE OBEN -->
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 10px auto; background: #202024; padding: 12px 25px; border-radius: 8px; border: 1px solid #29292e;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <h2 style="margin:0; color:#ff4757;">📻 Radio Dashboard</h2>
            </div>
            <div>
                <button onclick="showPage('home')" id="btn-home" class="nav-btn active">Startseite</button>
                <button onclick="openTracklistModal()" id="btn-tracklist" class="nav-btn inactive">🎵 Tracklist</button>
                <button onclick="showPage('team')" id="btn-team" class="nav-btn inactive">Unser Team</button>
            </div>
        </div>

        <!-- HEADER MIT STREAM-TITEL, CURRENT SONG & EMBED PLAYER -->
        <header class="header">
            <div>
                <h1 id="stream-name" style="margin:0;">📻 KRACHGARTEN</h1>
                <p style="margin: 5px 0 0 0; color: #a8a8b3;">🔴 Live On Air</p>
                <!-- SONGTITEL ANZEIGE -->
                <p style="margin: 8px 0 0 0; font-size: 1.05rem;">
                    🎵 Aktuell: <strong id="current-title" style="color: #04d361;">Lade Titel...</strong>
                </p>
            </div>

            <!-- RADIO.CO EMBED PLAYER (ORIGINAL-SCRIPT WIEDERHERGESTELLT) -->
            <div class="radio-co-player-wrapper">
                <script src="https://embed.radio.co/player/1ec17ac.js"></script>
            </div>
        </header>
    </div>

    <!-- HAUPTBEREICH / STARTSEITE -->
    <main id="content-home" class="main page-section active">
        
        <!-- LINKS: NEWS FEED -->
        <section>
            <h2>News & Updates</h2>
            <div id="news-container"></div>
        </section>

        <!-- RECHTS: SENDEPLAN & GRUß-/WUNSCHBOX -->
        <aside>
            <!-- Sendeplan Card -->
            <div class="card">
                <h3>📅 Sendeplan</h3>
                <ul id="schedule-container" style="list-style: none; padding: 0; margin-top: 10px;"></ul>
            </div>

            <!-- GRUß- & WUNSCHBOX -->
            <div class="card">
                <h3>💌 Gruß- & Wunschbox</h3>
                <p style="font-size: 0.85em; color: #a8a8b3; margin-bottom: 12px;">Sende dem DJ eine Nachricht!</p>
                
                <div id="wish-form">
                    <select id="w-type" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; background: #121214; border: 1px solid #29292e; color: #fff; border-radius: 4px;">
                        <option value="Musikwunsch">🎵 Musikwunsch</option>
                        <option value="Gruß">💌 Gruß</option>
                        <option value="Gruß & Wunsch">🎉 Gruß & Musikwunsch</option>
                    </select>

                    <input type="text" id="w-name" placeholder="Dein Name" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; background: #121214; border: 1px solid #29292e; color: #fff; border-radius: 4px;">
                    <input type="text" id="w-song" placeholder="Songwunsch (optional bei reiner Grußbotschaft)" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; background: #121214; border: 1px solid #29292e; color: #fff; border-radius: 4px;">
                    <textarea id="w-msg" placeholder="Deine Grußnachricht..." rows="3" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; background: #121214; border: 1px solid #29292e; color: #fff; border-radius: 4px; resize: vertical;"></textarea>
                    
                    <button onclick="sendWish()" style="width: 100%; padding: 10px; background: #ff4757; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Absenden 🚀</button>
                </div>
            </div>
        </aside>

    </main>

    <!-- UNSER TEAM BEREICH -->
    <div id="content-team" class="page-section" style="max-width: 1000px; margin: 20px auto;">
        <div style="width: 100%;">
            <h2 style="font-size: 1.8rem; margin-top: 0; margin-bottom: 20px;">👥 Unser Team</h2>
            <div id="team-page-list">
                <p style="color:#a8a8b3;">Lade Teammitglieder...</p>
            </div>
        </div>
    </div>

    <!-- TRACKLIST MODAL POPUP -->
    <div id="modal-tracklist" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 style="margin: 0; color: #ff4757;">🎵 Zuletzt gespielte Songs</h3>
                <button class="modal-close" onclick="closeTracklistModal()">&times;</button>
            </div>
            <div id="tracklist-container" style="overflow-y: auto; flex-grow: 1;">
                <p style="color:#a8a8b3;">Lade Song-Historie...</p>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT GANZ UNTEN -->
    <script>
        function showPage(page) {
            const homeSection = document.getElementById('content-home');
            const teamSection = document.getElementById('content-team');
            const btnHome = document.getElementById('btn-home');
            const btnTeam = document.getElementById('btn-team');

            if (page === 'home') {
                homeSection.style.display = 'grid';
                teamSection.style.display = 'none';

                btnHome.className = 'nav-btn active';
                btnTeam.className = 'nav-btn inactive';
            } else if (page === 'team') {
                homeSection.style.display = 'none';
                teamSection.style.display = 'block';

                btnHome.className = 'nav-btn inactive';
                btnTeam.className = 'nav-btn active';
            }
        }

        // TRACKLIST MODAL STEUERUNG
        function openTracklistModal() {
            document.getElementById('modal-tracklist').style.display = 'flex';
            fetchRadioCoData();
        }

        function closeTracklistModal() {
            document.getElementById('modal-tracklist').style.display = 'none';
        }

        // RADIO.CO STATS & TRACKLIST HOLEN
        async function fetchRadioCoData() {
            try {
                const res = await fetch('/api/radioco/status');
                if (!res.ok) return;

                const radioData = await res.json();

                // Höreranzeige aktualisieren
                // Tracklist (Historie) rendern
                const tracklistUI = document.getElementById('tracklist-container');
                if (tracklistUI && radioData.history) {
                    if (radioData.history.length === 0) {
                        tracklistUI.innerHTML = '<p style="color:#a8a8b3;">Keine vorangegangenen Songs gefunden.</p>';
                    } else {
                        tracklistUI.innerHTML = radioData.history.map(item => {
                            let formattedTime = '';
                            if (item.start_time) {
                                const d = new Date(item.start_time);
                                formattedTime = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                            }
                            return `
                                <div class="track-item">
                                    <div>
                                        <strong style="color: #ffffff;">${item.title || 'Unbekannter Song'}</strong>
                                    </div>
                                    <small style="color: #ff4757; font-weight: bold;">${formattedTime}</small>
                                </div>
                            `;
                        }).join('');
                    }
                }
            } catch (err) {
                console.error("Fehler beim Abrufen der Radio.co Daten:", err);
            }
        }

        async function loadHomepageData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();

                document.getElementById('stream-name').innerText = "📻 " + (data.streamName || "Radio");

                const currentTitleUI = document.getElementById('current-title');
                if (currentTitleUI) {
                    currentTitleUI.innerText = data.currentTitle || "Kein Sendungstitel angegeben";
                }

                const scheduleUI = document.getElementById('schedule-container');
                if (data.schedule && data.schedule.length > 0) {
                    scheduleUI.innerHTML = data.schedule.map(item => `
                        <li style="margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed #29292e;">
                            <span style="color:#ff4757; font-weight:bold;">
                                ${item.day ? item.day + ' | ' : ''}${item.time || ''}${item.endTime ? ' bis ' + item.endTime : ''} Uhr
                            </span><br>
                            <span style="color:#fff; font-weight:600;">🎙️ ${item.dj || item.name || 'DJ'}</span> 
                            <span style="color:#a8a8b3;">- ${item.title || item.show || 'Show'}</span>
                        </li>
                    `).join('');
                } else {
                    scheduleUI.innerHTML = '<li style="color:#a8a8b3;">Aktuell keine Sendungen eingetragen.</li>';
                }

                const newsUI = document.getElementById('news-container');
                if (data.news) {
                    newsUI.innerHTML = data.news.map(art => `
                        <div class="card">
                            <small style="color: #ff4757;">${art.date}</small>
                            <h3 style="margin: 5px 0;">${art.title}</h3>
                            <p style="color: #a8a8b3;">${art.text}</p>
                        </div>
                    `).join('');
                }

                const teamUI = document.getElementById('team-page-list');
                if (data.team && data.team.length > 0) {
                    const groupedTeam = {};
                    data.team.forEach(m => {
                        const dept = m.department || 'Allgemein';
                        if (!groupedTeam[dept]) groupedTeam[dept] = [];
                        groupedTeam[dept].push(m);
                    });

                    const icons = {
                        'Admins': '🛡️',
                        'Administration': '🛡️',
                        'DJs': '🎧',
                        'DJs & Moderatoren': '🎧',
                        'Redakteure': '✍️'
                    };

                    let html = '';
                    for (const [dept, members] of Object.entries(groupedTeam)) {
                        const icon = icons[dept] || '👤';
                        html += `
                            <div class="team-category">
                                <div class="team-category-title">${icon} ${dept}</div>
                                <div class="team-grid">
                                    ${members.map(m => `
                                        <div class="team-card">
                                            <div class="team-card-name">${m.name}</div>
                                            <div class="team-card-role">${m.role}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                    teamUI.innerHTML = html;
                } else {
                    teamUI.innerHTML = '<p style="color:#a8a8b3;">Noch keine Teammitglieder eingetragen.</p>';
                }

            } catch (err) {
                console.error("Fehler beim Laden der Daten:", err);
            }
        }

        async function sendWish() {
            const type = document.getElementById('w-type').value;
            const name = document.getElementById('w-name').value;
            const song = document.getElementById('w-song').value;
            const message = document.getElementById('w-msg').value;

            if (!name) return alert("Bitte gib deinen Namen an!");
            if (type !== "Gruß" && !song) return alert("Bitte trage deinen Songwunsch ein!");

            const res = await fetch('/api/wish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, name, song, message })
            });

            if (res.ok) {
                alert("Danke! Deine Nachricht wurde direkt ins DJ-Studio gesendet! 🎧");
                document.getElementById('w-name').value = '';
                document.getElementById('w-song').value = '';
                document.getElementById('w-msg').value = '';
            }
        }

        loadHomepageData();
        fetchRadioCoData();

        setInterval(loadHomepageData, 3000);
        setInterval(fetchRadioCoData, 10000);
    </script>
</body>
</html>
