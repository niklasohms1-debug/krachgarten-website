<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Redaktion - News Panel</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #121214; 
            color: #e1e1e6; 
            padding: 20px; 
            margin: 0;
        }

        /* LOGIN CONTAINER */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }

        .login-card {
            background: #202024;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #29292e;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card h2 {
            margin-top: 0;
            color: #ff9f43;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            box-sizing: border-box;
            background: #121214;
            border: 1px solid #29292e;
            color: #fff;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: #ff9f43;
            color: #121214;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #e0872b;
        }

        .btn-delete {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* EDITOR DASHBOARD (ANFANGS VERSTECKT) */
        #editor-content {
            display: none;
            max-width: 1000px;
            margin: auto;
        }

        .card { 
            background: #202024; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            border: 1px solid #29292e; 
        }

        .nav-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #202024; 
            padding: 15px 25px; 
            border-radius: 8px; 
            border: 1px solid #29292e;
            margin-bottom: 20px;
        }

        .news-item {
            background: #121214;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #29292e;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }
    </style>
</head>
<body>

    <!-- 1. REDAKTEUR LOGIN FENSTER -->
    <div id="login-section" class="login-wrapper">
        <div class="login-card">
            <h2>✍️ Redaktion Login</h2>
            <p style="color: #a8a8b3; font-size: 0.9rem; margin-bottom: 20px;">Melde dich an, um Artikel und News zu verfassen.</p>
            
            <form onsubmit="handleEditorLogin(event)">
                <input type="text" id="editor-user" class="input-field" placeholder="Benutzername" required>
                <input type="password" id="editor-pass" class="input-field" placeholder="Passwort" required>
                <button type="submit" class="btn-action">In die Redaktion einloggen ✍️</button>
            </form>
            <p id="login-error" style="color: #ff4757; margin-top: 15px; display: none; font-size: 0.9rem;">Zugangsdaten falsch!</p>
        </div>
    </div>

    <!-- 2. REDAKTEUR DASHBOARD CONTENT -->
    <div id="editor-content">
        
        <!-- NAVIGATION -->
        <div class="nav-header">
            <h2 style="margin:0; color:#ff9f43;">✍️ Redaktion Panel</h2>
            <div>
                <a href="/" style="color:#a8a8b3; text-decoration:none; margin-right:15px; font-weight:bold;">Hauptseite</a>
                <button onclick="logoutEditor()" style="background:none; border:1px solid #ff9f43; color:#ff9f43; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold;">Abmelden</button>
            </div>
        </div>

        <!-- ARTIKEL SCHREIBEN -->
        <div class="card">
            <h3>📰 News-Artikel verfassen</h3>
            <p style="color: #a8a8b3; font-size: 0.9rem; margin-bottom: 15px;">Veröffentliche Ankündigungen und News direkt auf der Hauptseite.</p>
            
            <label style="font-size:0.85rem; color:#a8a8b3;">Titel des Artikels:</label>
            <input type="text" id="news-title" class="input-field" placeholder="z. B. Neues Event am Wochenende!">
            
            <label style="font-size:0.85rem; color:#a8a8b3;">Inhalt / Text:</label>
            <textarea id="news-text" class="input-field" rows="6" placeholder="Schreibe hier deinen Newsbeitrag..." style="resize: vertical;"></textarea>
            
            <button onclick="publishNews()" class="btn-action" style="width: auto; padding: 10px 20px;">Artikel veröffentlichen 📢</button>
        </div>

        <!-- BEREITS VERÖFFENTLICHTE ARTIKEL (LISTE & LÖSCHEN) -->
        <div class="card">
            <h3 style="margin-bottom:10px;">Veröffentlichte Artikel</h3>
            <div id="news-list">
                <p style="color:#a8a8b3;">Lade Artikel...</p>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIK -->
    <script>
        window.onload = function() {
            if (localStorage.getItem('editorLoggedIn') === 'true') {
                showEditorContent();
            }
        };

        // LOGIN FUNKTION
        async function handleEditorLogin(e) {
            e.preventDefault();
            const username = document.getElementById('editor-user').value;
            const password = document.getElementById('editor-pass').value;

            try {
                const res = await fetch('/api/editor/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    localStorage.setItem('editorLoggedIn', 'true');
                    showEditorContent();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            } catch (err) {
                // Offline Fallback für Tests
                if ((username === "redakteur" || username === "editor") && password === "news123") {
                    localStorage.setItem('editorLoggedIn', 'true');
                    showEditorContent();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            }
        }

        function showEditorContent() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('editor-content').style.display = 'block';
            loadNewsData();
            setInterval(loadNewsData, 5000);
        }

        function logoutEditor() {
            localStorage.removeItem('editorLoggedIn');
            location.reload();
        }

        // NEWS DATED LADE-FUNKTION
        async function loadNewsData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                renderNewsList(data.news || []);
            } catch (err) {
                console.error("Fehler beim Laden der News:", err);
            }
        }

        // ARTIKEL VERÖFFENTLICHEN
        async function publishNews() {
            const title = document.getElementById('news-title').value;
            const text = document.getElementById('news-text').value;

            if (!title || !text) return alert("Bitte fülle Titel und Text aus!");

            const res = await fetch('/api/news', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, text })
            });

            if (res.ok) {
                alert("Artikel erfolgreich veröffentlicht! 📢");
                document.getElementById('news-title').value = '';
                document.getElementById('news-text').value = '';
                loadNewsData();
            } else {
                alert("Fehler beim Veröffentlichen des Artikels.");
            }
        }

        // ARTIKEL LÖSCHEN
        async function deleteNews(id) {
            if (!confirm("Artikel wirklich löschen?")) return;

            const res = await fetch(`/api/admin/news/${id}`, {
                method: 'DELETE'
            });

            if (res.ok) {
                loadNewsData();
            } else {
                alert("Fehler beim Löschen des Artikels.");
            }
        }

        // NEWS RENDERN
        function renderNewsList(news) {
            const newsUI = document.getElementById('news-list');
            if (!newsUI) return;
            
            if (!news || news.length === 0) {
                newsUI.innerHTML = '<p style="color:#a8a8b3;">Noch keine Artikel verfasst.</p>';
                return;
            }

            newsUI.innerHTML = news.map(item => `
                <div class="news-item">
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                        <strong style="color: #ff9f43; font-size: 1.05rem;">${item.title}</strong>
                        <button class="btn-delete" onclick="deleteNews(${item.id})">🗑️ Löschen</button>
                    </div>
                    <small style="color: #a8a8b3;">${item.date || ''}</small>
                    <div style="color: #ccc; font-size: 0.95rem; margin-top: 4px;">${item.text}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
