<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #121214; 
            color: #e1e1e6; 
            padding: 20px; 
            margin: 0;
        }

        /* LOGIN CONTAINER */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }

        .login-card {
            background: #202024;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #29292e;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card h2 {
            margin-top: 0;
            color: #ff4757;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            box-sizing: border-box;
            background: #121214;
            border: 1px solid #29292e;
            color: #fff;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-action {
            padding: 10px 18px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #e03e4d;
        }

        /* DASHBOARD (ANFANGS VERSTECKT) */
        #admin-content {
            display: none;
            max-width: 1000px;
            margin: auto;
        }

        .card { 
            background: #202024; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            border: 1px solid #29292e; 
        }

        .nav-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #202024; 
            padding: 15px 25px; 
            border-radius: 8px; 
            border: 1px solid #29292e;
            margin-bottom: 20px;
        }

        .team-member-item {
            background: #121214;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #29292e;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN FENSTER -->
    <div id="login-section" class="login-wrapper">
        <div class="login-card">
            <h2>👑 Admin Login</h2>
            <p style="color: #a8a8b3; font-size: 0.9rem; margin-bottom: 20px;">Melde dich an, um das Radio zu verwalten.</p>
            
            <form onsubmit="handleLogin(event)">
                <input type="text" id="admin-user" class="input-field" placeholder="Benutzername" required>
                <input type="password" id="admin-pass" class="input-field" placeholder="Passwort" required>
                <button type="submit" class="btn-action" style="width:100%;">Anmelden 🔓</button>
            </form>
            <p id="login-error" style="color: #ff4757; margin-top: 15px; display: none; font-size: 0.9rem;">Zugangsdaten falsch!</p>
        </div>
    </div>

    <!-- 2. ADMIN DASHBOARD CONTENT -->
    <div id="admin-content">
        
        <!-- NAVIGATION -->
        <div class="nav-header">
            <h2 style="margin:0; color:#ff4757;">👑 Admin Dashboard</h2>
            <div>
                <a href="/" style="color:#a8a8b3; text-decoration:none; margin-right:15px;">Hauptseite</a>
                <button onclick="logout()" style="background:none; border:1px solid #ff4757; color:#ff4757; padding:6px 12px; border-radius:4px; cursor:pointer;">Abmelden</button>
            </div>
        </div>

        <!-- 1. STREAM-NAME UND SONGTITEL ÄNDERN -->
        <div class="card">
            <h3>📻 Stream Name & Songtitel ändern</h3>
            
            <label style="font-size:0.85rem; color:#a8a8b3;">Radio Name (z. B. KRACHGARTEN):</label>
            <input type="text" id="new-stream-name" class="input-field" placeholder="Neuer Radioname">
            
            <label style="font-size:0.85rem; color:#a8a8b3;">Aktueller Song / DJ Show:</label>
            <input type="text" id="new-title" class="input-field" placeholder="Neuer Songtitel">
            
            <button onclick="updateRadioInfo()" class="btn-action">Speichern & Senden 🚀</button>
        </div>

        <!-- 2. TEAM MANAGEMENT -->
        <div class="card">
            <h3>👥 Team verwalten</h3>
            
            <!-- TEAM MITGLIED HINZUFÜGEN -->
            <div style="margin-bottom: 20px;">
                <input type="text" id="team-name" class="input-field" placeholder="Name des Team-Mitglieds">
                <input type="text" id="team-role" class="input-field" placeholder="Rolle (z. B. Moderator, Inhaber, DJ)">
                <button onclick="addTeamMember()" class="btn-action">Mitglied Hinzufügen ➕</button>
            </div>

            <!-- LISTE DER AKTUELLEN TEAMMITGLIEDER -->
            <h4 style="color:#a8a8b3; margin-bottom:10px;">Aktuelles Team:</h4>
            <div id="team-list">
                <p style="color:#666;">Lade Teammitglieder...</p>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIK -->
    <script>
        // Beim Laden prüfen, ob Admin eingeloggt ist
        window.onload = function() {
            if (localStorage.getItem('adminLoggedIn') === 'true') {
                showAdminContent();
            }
        };

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('admin-user').value;
            const password = document.getElementById('admin-pass').value;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    showAdminContent();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            } catch (err) {
                // Fallback für Tests ohne laufende Login-Route im Backend
                if (username === "admin" && password === "admin123") {
                    localStorage.setItem('adminLoggedIn', 'true');
                    showAdminContent();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            }
        }

        function showAdminContent() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadAdminData(); // Daten abrufen
        }

        function logout() {
            localStorage.removeItem('adminLoggedIn');
            location.reload();
        }

        // Lädt bestehende Daten vom Backend
        async function loadAdminData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();

                if (data.streamName) document.getElementById('new-stream-name').value = data.streamName;
                if (data.currentTitle) document.getElementById('new-title').value = data.currentTitle;

                renderTeamList(data.team || []);
            } catch (err) {
                console.error("Fehler beim Laden:", err);
            }
        }

        // 1. STREAM- & SONGTITEL SENDEN
        async function updateRadioInfo() {
            const streamName = document.getElementById('new-stream-name').value;
            const title = document.getElementById('new-title').value;

            const res = await fetch('/api/update-title', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ streamName, title })
            });

            if (res.ok) {
                alert("Radio-Informationen erfolgreich aktualisiert! 📻");
            } else {
                alert("Fehler beim Aktualisieren.");
            }
        }

        // 2. TEAM-MITGLIED HINZUFÜGEN
        async function addTeamMember() {
            const name = document.getElementById('team-name').value;
            const role = document.getElementById('team-role').value;

            if (!name || !role) return alert("Bitte Name und Rolle ausfüllen!");

            const res = await fetch('/api/admin/team', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, role })
            });

            if (res.ok) {
                alert("Mitglied hinzugefügt!");
                document.getElementById('team-name').value = '';
                document.getElementById('team-role').value = '';
                loadAdminData(); // Liste neu laden
            } else {
                alert("Fehler beim Hinzufügen des Mitglieds.");
            }
        }

        // Zeigt das Team in einer Liste an
        function renderTeamList(team) {
            const listUI = document.getElementById('team-list');
            if (!team || team.length === 0) {
                listUI.innerHTML = '<p style="color:#a8a8b3;">Noch keine Teammitglieder eingetragen.</p>';
                return;
            }

            listUI.innerHTML = team.map((member, index) => `
                <div class="team-member-item">
                    <div>
                        <strong>${member.name}</strong> <span style="color:#a8a8b3; font-size:0.85rem;">(${member.role})</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
