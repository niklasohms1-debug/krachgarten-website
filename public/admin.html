<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Login</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #121214; 
            color: #e1e1e6; 
            padding: 20px; 
            margin: 0;
        }

        /* LOGIN CONTAINER */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }

        .login-card {
            background: #202024;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #29292e;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card h2 {
            margin-top: 0;
            color: #ff4757;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            box-sizing: border-box;
            background: #121214;
            border: 1px solid #29292e;
            color: #fff;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #e03e4d;
        }

        /* DASHBOARD (ANFANGS VERSTECKT) */
        #admin-content {
            display: none;
            max-width: 1000px;
            margin: auto;
        }

        .card { 
            background: #202024; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            border: 1px solid #29292e; 
        }

        .nav-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #202024; 
            padding: 15px 25px; 
            border-radius: 8px; 
            border: 1px solid #29292e;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN FENSTER -->
    <div id="login-section" class="login-wrapper">
        <div class="login-card">
            <h2>👑 Admin Login</h2>
            <p style="color: #a8a8b3; font-size: 0.9rem; margin-bottom: 20px;">Melde dich an, um das Radio zu verwalten.</p>
            
            <form onsubmit="handleLogin(event)">
                <!-- BENUTZERNAME EINGABEFELD -->
                <input type="text" id="admin-user" class="input-field" placeholder="Benutzername" required>
                
                <input type="password" id="admin-pass" class="input-field" placeholder="Admin Passwort" required>
                
                <button type="submit" class="btn-login">Anmelden 🔓</button>
            </form>
            <p id="login-error" style="color: #ff4757; margin-top: 15px; display: none; font-size: 0.9rem;">Falsches Passwort!</p>
        </div>
    </div>

    <!-- 2. ADMIN INHALT (WIRD ERST NACH LOGIN SICHTBAR) -->
    <div id="admin-content">
        
        <!-- NAVIGATION -->
        <div class="nav-header">
            <h2 style="margin:0; color:#ff4757;">👑 Admin Dashboard</h2>
            <div>
                <a href="/" style="color:#a8a8b3; text-decoration:none; margin-right:15px;">Hauptseite</a>
                <button onclick="logout()" style="background:none; border:1px solid #ff4757; color:#ff4757; padding:6px 12px; border-radius:4px; cursor:pointer;">Abmelden</button>
            </div>
        </div>

        <!-- STREAM-TITEL ÄNDERN -->
        <div class="card">
            <h3>🎵 Aktuellen Song / Status ändern</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="new-title" class="input-field" style="margin:0;" placeholder="Neuer Songtitel / DJ Name">
                <button onclick="updateTitle()" class="btn-login" style="width: auto; padding: 0 20px;">Speichern</button>
            </div>
        </div>

        <!-- WEITERE ADMIN FEATURES (Z.B. NEWS / SENDEPLAN EDITING) -->
        <div class="card">
            <h3>📢 System Status</h3>
            <p style="color: #04d361;">✅ Backend online & verbunden</p>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Prüft beim Laden, ob der Admin bereits eingeloggt war
        window.onload = function() {
            if (localStorage.getItem('adminLoggedIn') === 'true') {
                showAdminContent();
            }
        };

        async function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('admin-pass').value;

            // Anforderung an das Backend schicken (oder hier lokales Passwort prüfen)
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            if (res.ok) {
                localStorage.setItem('adminLoggedIn', 'true');
                showAdminContent();
            } else {
                // Falls Backend-Route nicht existiert: Fallback-Passwort fürs Testing (z.B. "admin123")
                if (password === "admin123") {
                    localStorage.setItem('adminLoggedIn', 'true');
                    showAdminContent();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            }
        }

        function showAdminContent() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('adminLoggedIn');
            location.reload();
        }

        async function updateTitle() {
            const title = document.getElementById('new-title').value;
            if (!title) return alert("Bitte einen Titel eingeben!");

            const res = await fetch('/api/update-title', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });

            if (res.ok) {
                alert("Songtitel erfolgreich aktualisiert! 📻");
                document.getElementById('new-title').value = '';
            } else {
                alert("Fehler beim Aktualisieren.");
            }
        }
    </script>
</body>
</html>
