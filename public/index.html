<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Radio Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121214; color: #e1e1e6; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: auto; border-bottom: 1px solid #29292e; padding-bottom: 20px; }
        .main { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; max-width: 1000px; margin: 20px auto; }
        .card { background: #202024; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #29292e; }

        /* GELBES CONFIRM-REQUEST PLAYER OVERLAY (EXAKT WIE BILD 2) */
        .yellow-player-card {
            width: 380px;
            background: linear-gradient(180deg, #d4db1d 0%, #c4cc15 100%);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-family: 'Segoe UI', sans-serif;
            color: #222;
            padding-bottom: 12px;
            overflow: hidden;
        }

        .yellow-player-header {
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px 18px;
            color: #2b2e34;
            opacity: 0.9;
        }

        .yellow-player-body {
            display: flex;
            align-items: center;
            padding: 0 18px 10px 18px;
            gap: 15px;
        }

        .yellow-cover-box {
            width: 90px;
            height: 90px;
            background-color: #222;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .yellow-cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .yellow-song-details h3 {
            margin: 0 0 4px 0;
            font-size: 1.15rem;
            color: #1a1a1a;
            font-weight: 700;
        }

        .yellow-song-details p {
            margin: 0;
            font-size: 0.95rem;
            color: #444;
        }

        .yellow-player-controls {
            padding: 0 18px 8px 18px;
        }

        .yellow-player-controls audio {
            width: 100%;
            height: 36px;
            border-radius: 18px;
        }

        .yellow-player-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 0 18px;
        }

        .btn-action {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            width: 36px;
            height: 36px;
            color: #2b2e34;
            transition: transform 0.1s ease, color 0.2s ease;
        }

        .btn-action:hover {
            transform: scale(1.1);
            color: #000;
        }

        .btn-action svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- MENÜLEISTE OBEN -->
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 20px auto; background: #202024; padding: 15px 25px; border-radius: 8px; border: 1px solid #29292e;">
        <h2 style="margin:0; color:#ff4757;">📻 Radio Dashboard</h2>
        <div>
            <a href="/" style="color:#ff4757; text-decoration:none; margin-left:20px; font-weight:bold;">Startseite</a>
            <a href="/team.html" style="color:#a8a8b3; text-decoration:none; margin-left:20px; font-weight:bold;">Unser Team</a>
        </div>
    </div>

    <!-- HEADER MIT DEM GELBEN PLAYER OVERLAY (BILD 2 DESIGN) -->
    <header class="header">
        <div>
            <h1 id="stream-name">Lade Radio...</h1>
            <p style="color: #a8a8b3;">Live On Air</p>
        </div>

        <!-- DER GELBE WEBPLAYER EXAKT WIE IN BILD 2 -->
        <div class="yellow-player-card">
            <div class="yellow-player-header">
                Confirm Request
            </div>
            <div class="yellow-player-body">
                <div class="yellow-cover-box">
                    <img id="player-cover" src="https://via.placeholder.com/90/222222/ffffff?text=Cover" onerror="this.src='https://via.placeholder.com/90/222222/ffffff?text=No+Cover';" alt="Album Cover">
                </div>
                <div class="yellow-song-details">
                    <h3 id="song-title">Calm After The Storm</h3>
                    <p id="song-artist">The Common Linnetts</p>
                </div>
            </div>

            <!-- AUDIO PLAYER BEREICH -->
            <div class="yellow-player-controls">
                <audio id="audio-player" controls autoplay src="https://s5.radio.co/s5d31fcd9d/listen"></audio>
            </div>

            <!-- BESTÄTIGEN / ABLEHNEN BUTTONS -->
            <div class="yellow-player-actions">
                <button class="btn-action" onclick="alert('Abgelehnt')" title="Ablehnen">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
                </button>
                <button class="btn-action" onclick="alert('Angenommen')" title="Annehmen">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- HAUPTBEREICH -->
    <main class="main">
        
        <!-- LINKS: NEWS FEED -->
        <section>
            <h2>News & Updates</h2>
            <div id="news-container"></div>
        </section>

        <!-- RECHTS: SENDEPLAN & GRUß-/WUNSCHBOX -->
        <aside>
            <!-- Sendeplan Card -->
            <div class="card">
                <h3>📅 Sendeplan</h3>
                <ul id="schedule-container" style="list-style: none; padding: 0; margin-top: 10px;"></ul>
            </div>

            <!-- GRUß- & WUNSCHBOX -->
            <div class="card">
                <h3>💌 Gruß- & Wunschbox</h3>
                <p style="font-size: 0.85em; color: #a8a8b3; margin-bottom: 12px;">Sende dem DJ eine Nachricht!</p>
                
                <div id="wish-form">
                    <select id="w-type" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; background: #121214; border: 1px solid #29292e; color: #fff; border-radius: 4px;">
                        <option value="Musikwunsch">🎵 Musikwunsch</option>
                        <option value="Gruß">💌 Gruß</option>
                        <option value="Gruß & Wunsch">🎉 Gruß & Musikwunsch</option>
                    </select>

                    <input type="text" id="w-name" placeholder="Dein Name" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; background: #121214; border: 1px solid #29292e; color: #fff; border-radius: 4px;">
                    <input type="text" id="w-song" placeholder="Songwunsch (optional bei reiner Grußbotschaft)" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; background: #121214; border: 1px solid #29292e; color: #fff; border-radius: 4px;">
                    <textarea id="w-msg" placeholder="Deine Grußnachricht..." rows="3" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; background: #121214; border: 1px solid #29292e; color: #fff; border-radius: 4px; resize: vertical;"></textarea>
                    
                    <button onclick="sendWish()" style="width: 100%; padding: 10px; background: #ff4757; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Absenden 🚀</button>
                </div>
            </div>
        </aside>

    </main>

    <!-- JAVASCRIPT GANZ UNTEN -->
    <script>
        async function loadHomepageData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();

                document.getElementById('stream-name').innerText = "📻 " + (data.streamName || "Radio");
                document.getElementById('song-title').innerText = data.currentTitle || "Calm After The Storm";
                
                if (data.currentArtist) {
                    document.getElementById('song-artist').innerText = data.currentArtist;
                }
                
                if (data.coverUrl) {
                    document.getElementById('player-cover').src = data.coverUrl;
                }

                const scheduleUI = document.getElementById('schedule-container');
                if (data.schedule) {
                    scheduleUI.innerHTML = data.schedule.map(item => `
                        <li style="margin-bottom: 8px;">
                            <span style="color:#ff4757; font-weight:bold;">${item.time}</span><br>${item.show}
                        </li>
                    `).join('');
                }

                const newsUI = document.getElementById('news-container');
                if (data.news) {
                    newsUI.innerHTML = data.news.map(art => `
                        <div class="card">
                            <small style="color: #ff4757;">${art.date}</small>
                            <h3 style="margin: 5px 0;">${art.title}</h3>
                            <p style="color: #a8a8b3;">${art.text}</p>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error("Fehler beim Laden der Daten:", err);
            }
        }

        async function sendWish() {
            const type = document.getElementById('w-type').value;
            const name = document.getElementById('w-name').value;
            const song = document.getElementById('w-song').value;
            const message = document.getElementById('w-msg').value;

            if (!name) return alert("Bitte gib deinen Namen an!");
            if (type !== "Gruß" && !song) return alert("Bitte trage deinen Songwunsch ein!");

            const res = await fetch('/api/wish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, name, song, message })
            });

            if (res.ok) {
                alert("Danke! Deine Nachricht wurde direkt ins DJ-Studio gesendet! 🎧");
                document.getElementById('w-name').value = '';
                document.getElementById('w-song').value = '';
                document.getElementById('w-msg').value = '';
            }
        }

        loadHomepageData();
        setInterval(loadHomepageData, 3000);
    </script>
</body>
</html>
