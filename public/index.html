            display: flex;

            min-height: 100vh;

        }

        .countdown-box {
            background: #17191e;
            border: 3px solid #ff6b35;
            border-radius: 12px;
            padding: 40px 25px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
        }

        .sub-heading {
            color: #ff9f43;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .timer-unit {
            background: #202024;
            border: 1px solid #29292e;
            padding: 15px 8px;
            border-radius: 8px;
        }

        .timer-number {
            font-size: 2.2rem;
            font-weight: bold;
            color: #1dd1a1;
        }

        .timer-label {
            font-size: 0.72rem;
            color: #a4b0be;
            text-transform: uppercase;
            margin-top: 5px;
            font-weight: bold;
        }

        .status-text {
            font-size: 0.9rem;
            color: #dcdde1;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .timer-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
