<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #121214; 
            color: #e1e1e6; 
            padding: 20px; 
            margin: 0;
        }

        /* LOGIN CONTAINER */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }

        .login-card {
            background: #202024;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #29292e;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card h2 {
            margin-top: 0;
            color: #ff4757;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            box-sizing: border-box;
            background: #121214;
            border: 1px solid #29292e;
            color: #fff;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-action {
            padding: 10px 18px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #e03e4d;
        }

        .btn-delete {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* DASHBOARD (ANFANGS VERSTECKT) */
        #admin-content {
            display: none;
            max-width: 1000px;
            margin: auto;
        }

        .card { 
            background: #202024; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            border: 1px solid #29292e; 
        }

        .nav-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #202024; 
            padding: 15px 25px; 
            border-radius: 8px; 
            border: 1px solid #29292e;
            margin-bottom: 20px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #a8a8b3;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            color: #ff4757;
            background: #29292e;
        }

        .team-member-item, .wish-item {
            background: #121214;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #29292e;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* TABS UNTERSCHEIDUNG */
        .tab-page {
            display: none;
        }
        .tab-page.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN FENSTER -->
    <div id="login-section" class="login-wrapper">
        <div class="login-card">
            <h2>👑 Admin Login</h2>
            <p style="color: #a8a8b3; font-size: 0.9rem; margin-bottom: 20px;">Melde dich an, um das Radio zu verwalten.</p>
            
            <form onsubmit="handleLogin(event)">
                <input type="text" id="admin-user" class="input-field" placeholder="Benutzername" required>
                <input type="password" id="admin-pass" class="input-field" placeholder="Passwort" required>
                <button type="submit" class="btn-action" style="width:100%;">Anmelden 🔓</button>
            </form>
            <p id="login-error" style="color: #ff4757; margin-top: 15px; display: none; font-size: 0.9rem;">Zugangsdaten falsch!</p>
        </div>
    </div>

    <!-- 2. ADMIN DASHBOARD CONTENT -->
    <div id="admin-content">
        
        <!-- NAVIGATION LEISTE (MIT TABS SWITCHING) -->
        <div class="nav-header">
            <h2 style="margin:0; color:#ff4757;">👑 Admin Dashboard</h2>
            <div class="nav-links">
                <button onclick="switchTab('dashboard')" id="btn-tab-dashboard" class="nav-btn active">📊 Übersicht</button>
                <button onclick="switchTab('team')" id="btn-tab-team" class="nav-btn">👥 Team verwalten</button>
                <a href="/" style="color:#a8a8b3; text-decoration:none; font-weight: bold; font-size: 0.95rem; margin-left: 10px;">Zur Hauptseite</a>
                <button onclick="logout()" style="background:none; border:1px solid #ff4757; color:#ff4757; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; margin-left: 10px;">Abmelden</button>
            </div>
        </div>

        <!-- SEITE 1: ÜBERSICHT (DEFAULTSICHT) -->
        <div id="tab-dashboard" class="tab-page active">
            <!-- STREAM-NAME UND SONGTITEL ÄNDERN -->
            <div class="card">
                <h3>📻 Stream Name & Songtitel ändern</h3>
                
                <label style="font-size:0.85rem; color:#a8a8b3;">Radio Name (z. B. KRACHGARTEN):</label>
                <input type="text" id="new-stream-name" class="input-field" placeholder="Neuer Radioname">
                
                <label style="font-size:0.85rem; color:#a8a8b3;">Aktueller Song / DJ Show:</label>
                <input type="text" id="new-title" class="input-field" placeholder="Neuer Songtitel">
                
                <button onclick="updateRadioInfo()" class="btn-action">Speichern & Senden 🚀</button>
            </div>

            <!-- MUSIKWÜNSCHE & GRÜßE -->
            <div class="card">
                <h3>💌 Eingegangene Wünsche & Grüße</h3>
                <div id="wishes-list">
                    <p style="color:#666;">Lade Musikwünsche...</p>
                </div>
            </div>
        </div>

        <!-- SEITE 2: TEAM VERWALTEN (NUR BEI KLICK AUF DEN BUTTON SICHTBAR) -->
        <div id="tab-team" class="tab-page">
            <div class="card">
                <h3>👥 Team verwalten</h3>
                
                <!-- TEAM MITGLIED HINZUFÜGEN -->
                <div style="margin-bottom: 20px;">
                    <input type="text" id="team-name" class="input-field" placeholder="Name des Team-Mitglieds">
                    <input type="text" id="team-role" class="input-field" placeholder="Rolle (z. B. Moderator, Inhaber, DJ)">
                    <input type="text" id="team-dept" class="input-field" placeholder="Bereich/Abteilung (optional)">
                    <button onclick="addTeamMember()" class="btn-action">Mitglied Hinzufügen ➕</button>
                </div>

                <!-- LISTE DER AKTUELLEN TEAMMITGLIEDER -->
                <h4 style="color:#a8a8b3; margin-bottom:10px;">Aktuelles Team:</h4>
                <div id="team-list">
                    <p style="color:#666;">Lade Teammitglieder...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIK -->
    <script>
        window.onload = function() {
            if (localStorage.getItem('adminLoggedIn') === 'true') {
                showAdminContent();
            }
        };

        // TAB-WECHSEL LOGIK
        function switchTab(tabName) {
            // Alle Tabs ausblenden
            document.querySelectorAll('.tab-page').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            // Gewählten Tab einblenden
            if (tabName === 'dashboard') {
                document.getElementById('tab-dashboard').classList.add('active');
                document.getElementById('btn-tab-dashboard').classList.add('active');
            } else if (tabName === 'team') {
                document.getElementById('tab-team').classList.add('active');
                document.getElementById('btn-tab-team').classList.add('active');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('admin-user').value;
            const password = document.getElementById('admin-pass').value;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    showAdminContent();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            } catch (err) {
                if (username === "admin" && password === "katzi123") {
                    localStorage.setItem('adminLoggedIn', 'true');
                    showAdminContent();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            }
        }

        function showAdminContent() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadAdminData();
            setInterval(loadAdminData, 5000);
        }

        function logout() {
            localStorage.removeItem('adminLoggedIn');
            location.reload();
        }

        async function loadAdminData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();

                if (data.streamName && document.activeElement.id !== 'new-stream-name') {
                    document.getElementById('new-stream-name').value = data.streamName;
                }
                if (data.currentTitle && document.activeElement.id !== 'new-title') {
                    document.getElementById('new-title').value = data.currentTitle;
                }

                renderTeamList(data.team || []);
                renderWishesList(data.wishes || []);
            } catch (err) {
                console.error("Fehler beim Laden:", err);
            }
        }

        async function updateRadioInfo() {
            const streamName = document.getElementById('new-stream-name').value;
            const currentTitle = document.getElementById('new-title').value;

            const res = await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ streamName, currentTitle })
            });

            if (res.ok) {
                alert("Radio-Informationen erfolgreich aktualisiert! 📻");
            } else {
                alert("Fehler beim Aktualisieren.");
            }
        }

        async function addTeamMember() {
            const name = document.getElementById('team-name').value;
            const role = document.getElementById('team-role').value;
            const department = document.getElementById('team-dept').value;

            if (!name || !role) return alert("Bitte Name und Rolle ausfüllen!");

            const res = await fetch('/api/admin/team', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, role, department })
            });

            if (res.ok) {
                alert("Mitglied hinzugefügt!");
                document.getElementById('team-name').value = '';
                document.getElementById('team-role').value = '';
                document.getElementById('team-dept').value = '';
                loadAdminData();
            } else {
                alert("Fehler beim Hinzufügen des Mitglieds.");
            }
        }

        async function deleteTeamMember(id) {
            if (!confirm("Mitglied wirklich löschen?")) return;

            const res = await fetch(`/api/admin/team/${id}`, {
                method: 'DELETE'
            });

            if (res.ok) {
                loadAdminData();
            } else {
                alert("Fehler beim Löschen.");
            }
        }

        function renderTeamList(team) {
            const listUI = document.getElementById('team-list');
            if (!team || team.length === 0) {
                listUI.innerHTML = '<p style="color:#a8a8b3;">Noch keine Teammitglieder eingetragen.</p>';
                return;
            }

            listUI.innerHTML = team.map(member => `
                <div class="team-member-item">
                    <div>
                        <strong>${member.name}</strong> 
                        <span style="color:#a8a8b3; font-size:0.85rem;">(${member.role}${member.department ? ' - ' + member.department : ''})</span>
                    </div>
                    <button class="btn-delete" onclick="deleteTeamMember(${member.id})">🗑️ Löschen</button>
                </div>
            `).join('');
        }

        function renderWishesList(wishes) {
            const wishesUI = document.getElementById('wishes-list');
            if (!wishes || wishes.length === 0) {
                wishesUI.innerHTML = '<p style="color:#a8a8b3;">Keine neuen Wünsche oder Grüße vorhanden.</p>';
                return;
            }

            wishesUI.innerHTML = wishes.map(w => `
                <div class="wish-item" style="flex-direction: column; align-items: flex-start; gap: 5px;">
                    <div style="display: flex; justify-content: space-between; width: 100%;">
                        <strong style="color: #ff4757;">${w.type} von ${w.name}</strong>
                        <small style="color: #a8a8b3;">${w.time || ''}</small>
                    </div>
                    ${w.song && w.song !== '-' ? `<div>🎵 <strong>Song:</strong> ${w.song}</div>` : ''}
                    ${w.message ? `<div style="color: #ccc;">💬 "${w.message}"</div>` : ''}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
