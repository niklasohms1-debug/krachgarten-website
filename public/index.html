<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krachgarten Radio | Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Verdana', sans-serif;
            background: #0b4975 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.12"><circle cx="20" cy="20" r="1.5" fill="%23fff"/><circle cx="80" cy="50" r="2" fill="%23fff"/><circle cx="40" cy="80" r="1" fill="%23fff"/></svg>') repeat;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .countdown-box {
            background: #17191e;
            border: 3px solid #ff6b35;
            border-radius: 12px;
            padding: 40px 25px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
        }

        .sub-heading {
            color: #ff9f43;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .timer-unit {
            background: #202024;
            border: 1px solid #29292e;
            padding: 15px 8px;
            border-radius: 8px;
        }

        .timer-number {
            font-size: 2.2rem;
            font-weight: bold;
            color: #1dd1a1;
            font-family: 'Courier New', monospace;
        }

        .timer-label {
            font-size: 0.72rem;
            color: #a4b0be;
            text-transform: uppercase;
            margin-top: 5px;
            font-weight: bold;
        }

        .status-text {
            font-size: 0.9rem;
            color: #dcdde1;
            line-height: 1.5;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 6px;
        }

        @media (max-width: 480px) {
            .timer-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="countdown-box">
        <h1>📻 Krachgarten Radio</h1>
        <p id="sub-heading" class="sub-heading">🚀 Wir starten morgen um 18:00 Uhr!</p>

        <div class="timer-grid">
            <div class="timer-unit">
                <div id="days" class="timer-number">00</div>
                <div class="timer-label">Tage</div>
            </div>
            <div class="timer-unit">
                <div id="hours" class="timer-number">00</div>
                <div class="timer-label">Stunden</div>
            </div>
            <div class="timer-unit">
                <div id="minutes" class="timer-number">00</div>
                <div class="timer-label">Minuten</div>
            </div>
            <div class="timer-unit">
                <div id="seconds" class="timer-number">00</div>
                <div class="timer-label">Sekunden</div>
            </div>
        </div>

        <p class="status-text">Mache dich bereit für Musikwünsche, Krachies, Minigames & den Song der Woche!</p>
    </div>

    <script>
        // Zielzeit festlegen: Morgen um 18:00 Uhr
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 1);
        targetDate.setHours(18, 0, 0, 0);

        // Falls du ein exaktes festes Datum vorgeben willst, nutze stattdessen diese Zeile:
        // const targetDate = new Date('2026-08-14T18:00:00');

        function updateCountdown() {
            const now = new Date();
            const distance = targetDate.getTime() - now.getTime();
            const subHeadingEl = document.getElementById('sub-heading');

            // Wenn die Zeit abgelaufen ist
            if (distance <= 0) {
                document.querySelector('.countdown-box').innerHTML = `
                    <h1>🎉 WIR SIND ON AIR!</h1>
                    <p class="sub-heading">Lade die Seite neu, um das Dashboard zu öffnen!</p>
                    <button onclick="location.reload()" style="background:linear-gradient(180deg, #ff9f43 0%, #ee5253 100%); border:none; color:#fff; font-weight:bold; padding:12px 24px; border-radius:6px; cursor:pointer; font-size:1rem; margin-top:10px; box-shadow:0 4px 10px rgba(0,0,0,0.4);">Jetzt Reinhören 📻</button>
                `;
                return;
            }

            // Prüfen, ob "heute" oder "morgen" angezeigt werden muss
            const isToday = now.getFullYear() === targetDate.getFullYear() &&
                            now.getMonth() === targetDate.getMonth() &&
                            now.getDate() === targetDate.getDate();

            if (subHeadingEl) {
                if (isToday) {
                    subHeadingEl.innerText = "🚀 Wir starten heute um 18:00 Uhr!";
                } else {
                    subHeadingEl.innerText = "🚀 Wir starten morgen um 18:00 Uhr!";
                }
            }

            // Umrechnung der Restzeit
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        // Sofort ausführen und dann jede Sekunde aktualisieren
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
